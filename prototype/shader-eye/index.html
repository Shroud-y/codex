<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>shader eye — prototype</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #050A0C; overflow: hidden; }

  #stage {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: #050A0C;
  }
  canvas { display: block; }

  #panel, #hud {
    position: fixed;
    font: 11px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
    color: #9fb3b8;
    background: rgba(6, 12, 14, 0.82);
    border: 1px solid rgba(120, 190, 205, 0.16);
    backdrop-filter: blur(6px);
    border-radius: 4px;
    user-select: none;
  }

  #panel {
    top: 12px; left: 12px; width: 320px;
    max-height: calc(100vh - 24px); overflow-y: auto;
    padding: 10px 12px;
  }
  #hud { top: 12px; right: 12px; padding: 10px 12px; min-width: 260px; }

  .row {
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-areas: "name val" "input input";
    gap: 2px 8px;
    margin-bottom: 7px;
  }
  .name { grid-area: name; }
  .val  { grid-area: val; color: #d7eef2; }
  .row input { grid-area: input; width: 100%; }
  input[type="range"] { height: 14px; accent-color: #3FC8DC; }
  input[type="color"] { height: 20px; padding: 0; border: 0; background: none; }

  .buttons { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  button, select {
    font: inherit; color: #cfe7ec;
    background: #0d181c; border: 1px solid rgba(120, 190, 205, 0.28);
    border-radius: 3px; padding: 3px 8px; cursor: pointer;
  }
  button:hover, select:hover { border-color: #3FC8DC; }
  #rage { color: #FFB199; border-color: rgba(255, 90, 60, 0.45); }

  .pair { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
  hr { border: 0; border-top: 1px solid rgba(120, 190, 205, 0.14); margin: 10px 0; }
  #readout { color: #d7eef2; letter-spacing: 0.02em; }
  #flash { color: #FFB199; min-height: 1.5em; margin-top: 6px; }
  .note { color: #5d777d; }

  body.bare #panel, body.bare #hud { display: none; }
</style>
</head>
<body>
  <div id="stage"><canvas id="gl"></canvas></div>

  <div id="panel">
    <div class="buttons">
      <button id="rage">rage preset</button>
      <button id="reset">reset</button>
      <button id="copy">copy uniforms</button>
      <button id="hide">hide chrome</button>
    </div>
    <hr />
    <!-- sliders are built in app.js from the PARAMS table -->
  </div>

  <div id="hud">
    <div id="readout">starting…</div>
    <hr />
    <div class="pair"><span>background</span>
      <select id="bg">
        <option value="0">near-black #050A0C</option>
        <option value="1">bright wallpaper</option>
        <option value="2">mid grey</option>
      </select>
    </div>
    <div class="pair"><span>tonemap</span>
      <select id="tm">
        <option value="0">ACES</option>
        <option value="1">Reinhard</option>
      </select>
    </div>
    <div class="pair"><span>render size</span>
      <select id="res">
        <option value="native">native (window × dpr)</option>
        <option value="overlay">overlay-sized (300 × 350)</option>
        <option value="1080p">1920 × 1080</option>
        <option value="4k">3840 × 2160</option>
      </select>
    </div>
    <div class="buttons"><button id="bench">bench 240 frames</button></div>
    <div id="flash"></div>
    <div class="note">gpu time needs EXT_disjoint_timer_query_webgl2</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
